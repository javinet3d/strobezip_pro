  <link id="pwa-manifest-link" rel="manifest" href="">
  <style>
    :root {
      --matte-black: #0b0b0c;
      --matte-surface: #17171a;
      --matte-elevated: #242429;
      --amber-accent: #f59e0b;
      --chrome-accent: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background-color: #0b0b0c;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.008) 0px, rgba(255, 255, 255, 0.008) 1px, transparent 1px, transparent 4px);
    }

    /* Respaldo visual de orientación vertical ('portrait') */
    #portrait-lock-wrapper {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    @media screen and (orientation: landscape) and (max-height: 540px) {
      body:not(.zippo-fullscreen-mode) #portrait-lock-wrapper {
        max-width: 430px;
        margin: 0 auto;
        border-left: 1px solid rgba(255, 255, 255, 0.09);
        border-right: 1px solid rgba(255, 255, 255, 0.09);
        background-color: #0b0b0c;
      }
    }

    .font-mono-tech {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    /* Utilidades de layout autocontenidas (100% offline sin CDN) */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1 1 0%; }
    .items-center { align-items: center; }

    /* Dimensiones y bordes */
    .w-2 { width: 0.5rem; }
    .h-2 { height: 0.5rem; }
    .w-2\.5 { width: 0.625rem; }
    .h-2\.5 { height: 0.625rem; }
    .w-3 { width: 0.75rem; }
    .h-3 { height: 0.75rem; }
    .w-3\.5 { width: 0.875rem; }
    .h-3\.5 { height: 0.875rem; }

    .h-4 { height: 1rem; }

    .rounded-lg { border-radius: 0.5rem; }

    /* Tipografía y colores */

    .text-white { color: #ffffff; }

    .text-zinc-200 { color: #e4e4e7; }
    .text-zinc-300 { color: #d4d4d8; }
    .text-zinc-400 { color: #a1a1aa; }
    .text-zinc-500 { color: #71717a; }
    .text-zinc-600 { color: #52525b; }
    .text-black { color: #000000; }
    .text-amber-300 { color: #fcd34d; }
    .text-amber-400 { color: #fbbf24; }
    .text-emerald-400 { color: #34d399; }
    .text-red-400 { color: #f87171; }

    .bg-white { background-color: #ffffff; }
    .bg-black\/40 { background-color: rgba(0, 0, 0, 0.4); }
    .bg-black\/55 { background-color: rgba(0, 0, 0, 0.55); }

    .bg-\[\#111114\] { background-color: #111114; }
    .bg-\[\#141417\] { background-color: #141417; }
    .bg-\[\#1c1c21\] { background-color: #1c1c21; }
    .bg-zinc-500 { background-color: #71717a; }
    .bg-zinc-600 { background-color: #52525b; }
    .bg-zinc-700 { background-color: #3f3f46; }
    .bg-zinc-800 { background-color: #27272a; }
    .bg-zinc-900 { background-color: #18181b; }
    .bg-zinc-900\/95 { background-color: rgba(24, 24, 27, 0.95); }
    .bg-amber-400 { background-color: #fbbf24; }
    .bg-amber-500 { background-color: #f59e0b; }
    .bg-amber-500\/20 { background-color: rgba(245, 158, 11, 0.2); }
    .bg-amber-500\/25 { background-color: rgba(245, 158, 11, 0.25); }
    .bg-emerald-400 { background-color: #34d399; }
    .bg-red-400 { background-color: #f87171; }
    .bg-white\/10 { background-color: rgba(255, 255, 255, 0.1); }
    .bg-gradient-to-r { background-image: linear-gradient(to right, #10b981, #fbbf24, #ef4444); }

    .border { border-width: 1px; border-style: solid; }
    .border-transparent { border-color: transparent; }
    .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
    .border-white\/15 { border-color: rgba(255, 255, 255, 0.15); }
    .border-white\/25 { border-color: rgba(255, 255, 255, 0.25); }
    .border-zinc-600 { border-color: #52525b; }
    .border-zinc-700 { border-color: #3f3f46; }
    .border-zinc-800 { border-color: #27272a; }
    .border-amber-300 { border-color: #fcd34d; }
    .border-amber-400 { border-color: #fbbf24; }
    .border-amber-500\/35 { border-color: rgba(245, 158, 11, 0.35); }
    .border-amber-500\/40 { border-color: rgba(245, 158, 11, 0.4); }
    .border-red-500\/35 { border-color: rgba(239, 68, 68, 0.35); }

    .opacity-0 { opacity: 0; }
    .shadow-inner { box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.65); }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85); }
    .backdrop-blur-md { -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    .transition-all { transition: all 0.15s ease; }
    .transition-colors { transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease; }
    .transition-opacity { transition: opacity 0.15s ease; }
    .duration-75 { transition-duration: 75ms; }
    .duration-150 { transition-duration: 150ms; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .animate-pulse { animation: pulse-dot 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    select:focus {
      outline: none;
      border-color: #f59e0b;
    }

    /* Aislamiento estricto de vistas para evitar cualquier solapamiento entre pestañas */
    .view-section:not(.active) {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .view-section.active {
      display: flex !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }

    /* Superficies Negro Mate Satinado */
    .matte-panel {
      background: linear-gradient(145deg, #1b1b1f 0%, #131316 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        0 6px 18px -4px rgba(0, 0, 0, 0.8);
    }

    .tactical-btn {
      background: linear-gradient(180deg, #27272d 0%, #17171a 100%);
      border: 1px solid #32323a;
      color: #f9fafb;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        0 3px 6px rgba(0, 0, 0, 0.55);
      transition: transform 0.08s ease, background 0.1s ease, border-color 0.1s ease;
    }

    .tactical-btn:active {
      transform: translateY(1px) scale(0.985);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
    }

    .tactical-btn.active-amber {
      background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
      border-color: #fbbf24;
      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 0 16px rgba(245, 158, 11, 0.45);
    }

    .tactical-btn.active-emerald {
      background: linear-gradient(180deg, #059669 0%, #065f46 100%);
      border-color: #34d399;
      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 0 16px rgba(16, 185, 129, 0.45);
    }

    .tactical-btn.active-red {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border-color: #f87171;
      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        0 0 16px rgba(239, 68, 68, 0.45);
    }

    /* Sliders tácticos */
    input[type="range"].tactical-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: #0b0b0c;
      border-radius: 999px;
      border: 1px solid #2e2e36;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.85);
      outline: none;
    }

    input[type="range"].tactical-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f9fafb 0%, #9ca3af 60%, #4b5563 100%);
      border: 2px solid #18181b;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.85), inset 0 1px 1px #ffffff;
      cursor: pointer;
    }

    input[type="range"].tactical-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f9fafb 0%, #9ca3af 60%, #4b5563 100%);
      border: 2px solid #18181b;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.85);
      cursor: pointer;
    }

    /* Barra unificada de nivel sonoro + deslizador interactivo de umbral */
    #mic-unified-bar {
      position: relative;
      height: 18px;
      background: #09090b;
      border-radius: 999px;
      border: 1px solid #2e2e36;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.85);
      touch-action: none;
      cursor: ew-resize;
    }

    #mic-threshold-handle {
      position: absolute;
      top: 50%;
      left: 60%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f87171 58%, #991b1b 100%);
      border: 2px solid #18181b;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.9), 0 0 8px rgba(239, 68, 68, 0.45);
      pointer-events: none;
      z-index: 5;
    }

    #mic-threshold-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 60%;
      width: 2px;
      background: #f87171;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 4;
    }

    #screen-flash-overlay {
      pointer-events: none;
      transition: opacity 0.015s linear;
    }

    /* Contenedor normal del Zippo sin transiciones para restauración instantánea en 0 ms */
    #zippoCard {
      position: relative;
      z-index: auto;
      transition: none !important;
      animation: none !important;
    }

    #zippoCanvasWrapper {
      position: relative;
      z-index: auto;
      touch-action: none;
      transition: none !important;
      animation: none !important;
    }

    #zippo-canvas {
      position: relative;
      z-index: auto;
      display: block;
      width: 100%;
      height: 100%;
      transition: none !important;
      animation: none !important;
    }

    /* Pantalla completa minimalista del Zippo */
    body.zippo-fullscreen-mode {
      background-color: #000000 !important;
      background-image: none !important;
      overflow: hidden !important;
    }
    body.zippo-fullscreen-mode #portrait-lock-wrapper {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100dvh !important;
      border: none !important;
    }
    body.zippo-fullscreen-mode header,
    body.zippo-fullscreen-mode #zippo-top-toolbar {
      display: none !important;
    }
    body.zippo-fullscreen-mode main {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100dvh !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    body.zippo-fullscreen-mode #view-zippo.active {
      height: 100dvh !important;
      width: 100vw !important;
      gap: 0 !important;
    }
    body.zippo-fullscreen-mode #zippoCard {
      position: fixed !important;
      inset: 0 !important;
      z-index: 30 !important;
      border-radius: 0 !important;
      border: none !important;
      background: #000000 !important;
      box-shadow: none !important;
      height: 100dvh !important;
      width: 100vw !important;
    }
    body.zippo-fullscreen-mode #zippoCanvasWrapper {
      height: 100dvh !important;
      width: 100vw !important;
    }
    body.zippo-fullscreen-mode #btn-exit-fullscreen {
      display: flex !important;
    }
  </style>
</head>
<body>

  <!-- Vídeo activo de 16x16 px con opacity 0.01 para mantener el LED operativo en PWA instalada -->
  <video id="torchVideo" width="16" height="16" playsinline muted autoplay style="position:fixed;bottom:0;right:0;width:16px;height:16px;opacity:0.01;pointer-events:none;z-index:1;"></video>

  <!-- Capa de flash de pantalla sincronizado -->
  <div id="screen-flash-overlay" class="fixed inset-0 z-50 bg-white opacity-0"></div>

  <!-- Aviso flotante discreto (sin alert) -->
  <div id="toast-notification" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-3.5 py-1.5 rounded-full bg-zinc-900/95 border border-white/15 text-[11px] font-mono-tech text-zinc-100 shadow-2xl opacity-0 pointer-events-none transition-opacity duration-150 whitespace-nowrap"></div>

  <div id="portrait-lock-wrapper">
    <!-- Barra Superior Compacta: Título, Estado LED, Selector Hardware y Test LED -->
    <header class="w-full max-w-md px-3 pt-2 pb-1.5 z-20 shrink-0">
      <div class="px-2.5 py-1.5 rounded-xl bg-[#141417] border border-white/10 flex items-center justify-between gap-1.5">
        <div class="flex items-center gap-1.5 min-w-0">
          <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="currentColor" viewBox="0 0 24 24">
            <path d="M13 2L4 14h7l-2 8 9-12h-7l2-8z"/>
          </svg>
          <span class="text-[11px] font-extrabold tracking-tight text-zinc-100 truncate">StrobePro</span>
          <span class="text-zinc-600 text-[10px]">•</span>
          <span id="hw-led-dot" class="w-2 h-2 rounded-full bg-zinc-600 shrink-0"></span>
          <span id="hw-status-text" class="text-[10px] font-mono-tech text-zinc-300 truncate">LED Listo</span>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <select id="output-mode-select" aria-label="Modo de salida" class="bg-[#1c1c21] text-zinc-200 border border-zinc-700 rounded-md px-1.5 py-0.5 text-[10px] font-mono-tech">
            <option value="auto">Auto (LED+Pant.)</option>
            <option value="led">Solo LED Trasero</option>
            <option value="screen">Solo Pantalla</option>
          </select>
          <button id="btn-test-led" type="button" class="px-2 py-0.5 rounded-md bg-zinc-800 border border-zinc-600 text-[10px] font-bold text-amber-400">
            Test LED
          </button>
        </div>
      </div>

      <!-- Control Segmentado de 2 Pestañas -->
      <div class="matte-panel rounded-xl p-1 mt-1.5 flex items-center justify-between gap-1.5">
        <button id="tab-torch" type="button" class="flex-1 py-1.5 px-2.5 rounded-lg font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-1.5 transition-all bg-amber-500/20 text-amber-400 border border-amber-500/40">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span>Linterna / Estrobo</span>
        </button>
        <button id="tab-zippo" type="button" class="flex-1 py-1.5 px-2.5 rounded-lg font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-1.5 transition-all text-zinc-400 border border-transparent">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/>
          </svg>
          <span>Mechero Zippo</span>
        </button>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="w-full max-w-md flex-1 px-3 pb-2.5 flex flex-col gap-2 z-10 min-h-0">

      <!-- ========================================================= -->
      <!-- PESTAÑA 1: LINTERNA / ESTROBO                             -->

  <script>
    /**
     * ============================================================================
     * 1. BLOQUEO DE ORIENTACIÓN VERTICAL ('portrait'), PWA DINÁMICA Y SW OFFLINE
     * ============================================================================
     */
    function lockPortraitOrientation() {
      try {
        if (screen.orientation && typeof screen.orientation.lock === 'function') {
          screen.orientation.lock('portrait').catch(() => {});
        } else if (typeof screen.lockOrientation === 'function') {
          screen.lockOrientation('portrait');
        } else if (typeof screen.mozLockOrientation === 'function') {
          screen.mozLockOrientation('portrait');
        } else if (typeof screen.msLockOrientation === 'function') {
          screen.msLockOrientation('portrait');
        }
      } catch (e) {}
    }

    (function setupDynamicPWAAndOffline() {
      try {
        function createPngIconDataUrl(size) {
          const c = document.createElement('canvas');
          c.width = size;
          c.height = size;
          const ctx = c.getContext('2d');
          const r = size * 0.22;

          ctx.fillStyle = '#0b0b0c';
          ctx.beginPath();
          ctx.roundRect(0, 0, size, size, r);
          ctx.fill();

          const inset = size * 0.08;
          ctx.fillStyle = '#17171a';
          ctx.strokeStyle = '#32323a';
          ctx.lineWidth = Math.max(2, size * 0.02);
          ctx.beginPath();
          ctx.roundRect(inset, inset, size - inset * 2, size - inset * 2, r * 0.78);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(size * 0.54, size * 0.18);
          ctx.lineTo(size * 0.30, size * 0.54);
          ctx.lineTo(size * 0.48, size * 0.54);
          ctx.lineTo(size * 0.43, size * 0.82);
          ctx.lineTo(size * 0.70, size * 0.45);
          ctx.lineTo(size * 0.52, size * 0.45);
          ctx.closePath();
          ctx.fill();

          return c.toDataURL('image/png');
        }

        const icon192 = createPngIconDataUrl(192);
        const icon512 = createPngIconDataUrl(512);

        const manifest = {
          name: 'StrobePro & Zippo Studio',
          short_name: 'StrobeZippo',
          description: 'Linterna fija, estroboscopio reactivo al sonido y simulador de mechero Zippo.',
          start_url: location.href,
          scope: './',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#0b0b0c',
          theme_color: '#0b0b0c',
          icons: [
            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const linkEl = document.getElementById('pwa-manifest-link');
        if (linkEl) linkEl.setAttribute('href', manifestURL);
      } catch (e) {}

      // Registro silencioso de ./sw.js para ejecución 100% offline en servidor HTTPS/GitHub Pages
      try {
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      } catch (e) {}

      lockPortraitOrientation();
      window.addEventListener('orientationchange', lockPortraitOrientation);
      document.addEventListener('pointerdown', lockPortraitOrientation, { passive: true });
    })();

    function showToast(message) {
      try {
        const toast = document.getElementById('toast-notification');
        if (!toast) return;
        toast.textContent = message;
        toast.style.opacity = '1';
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => {
          toast.style.opacity = '0';
        }, 2100);
      } catch (e) {}
    }

    function formatHz(hz) {
      return hz < 1 ? `${hz.toFixed(2)} Hz` : `${hz.toFixed(1)} Hz`;
    }

    /**
     * ============================================================================
     * 2. CONTROLADOR DE FLASH LED TRASERO (COMPATIBLE CON PWA / WEBAPK)
     * ============================================================================
     */
    class SmartHardwareTorchController {
      constructor() {
        this.videoEl = document.getElementById('torchVideo');
        this.stream = null;
        this.track = null;
        this.imageCapture = null;
        this.hasHardwareTorch = false;
        this.isTorchOn = false;
        this.initPromise = null;

        this.screenOverlay = document.getElementById('screen-flash-overlay');
        this.beamIndicator = document.getElementById('beam-indicator');
        this.beamCore = document.getElementById('beam-core');
        this.hwDot = document.getElementById('hw-led-dot');
        this.hwText = document.getElementById('hw-status-text');
        this.outputModeSelect = document.getElementById('output-mode-select');

        const handleResume = () => {
          if (document.visibilityState === 'visible') {
            lockPortraitOrientation();
            if (this.track && this.track.readyState === 'ended') {
              this.releaseHardware();
              if (this.isTorchOn) {
                this.initHardware().then(() => this.setTorch(true));
              }
            } else if (this.isTorchOn && this.hasHardwareTorch) {
              this.setTorch(true);
            }
          }
        };

        document.addEventListener('visibilitychange', handleResume);
        window.addEventListener('pageshow', handleResume);
      }

      updateStatus(text, colorClass = 'bg-zinc-600') {
        if (this.hwText) this.hwText.textContent = text;
        if (this.hwDot) this.hwDot.className = `w-2 h-2 rounded-full shrink-0 ${colorClass}`;
      }

      releaseHardware() {
        try {
          if (this.stream) {
            this.stream.getTracks().forEach((t) => {
              try { t.stop(); } catch (e) {}
            });
          }
        } catch (e) {}
        this.stream = null;
        this.track = null;
        this.imageCapture = null;
        this.hasHardwareTorch = false;
      }

      async tryActivateCameraWithTorch(constraints) {
        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          const track = stream.getVideoTracks()[0];
          if (!track) {
            stream.getTracks().forEach(t => t.stop());
            return null;
          }

          if (this.videoEl) {
            this.videoEl.srcObject = stream;
            try {
              await this.videoEl.play();
            } catch (e) {}
          }

          await new Promise(r => setTimeout(r, 140));

          const caps = typeof track.getCapabilities === 'function' ? track.getCapabilities() : {};
          if (caps && caps.torch === false) {
            stream.getTracks().forEach(t => t.stop());
            return null;
          }

          try {
            await track.applyConstraints({ advanced: [{ torch: false }] });
          } catch (e) {}
          await track.applyConstraints({ advanced: [{ torch: true }] });
          await new Promise(r => setTimeout(r, 60));

          const settings = typeof track.getSettings === 'function' ? track.getSettings() : {};
          if (settings && settings.torch === false && caps && !caps.torch) {
            stream.getTracks().forEach(t => t.stop());
            return null;
          }

          try {
            await track.applyConstraints({ advanced: [{ torch: false }] });
          } catch (e) {}

          return { stream, track };
        } catch (err) {
          if (stream) {
            stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          }
          return null;
        }
      }

      async initHardware() {
        if (this.hasHardwareTorch && this.track && this.track.readyState === 'live') {
          return true;
        }
        if (this.initPromise) return this.initPromise;

        this.initPromise = (async () => {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            this.updateStatus('Modo Pantalla', 'bg-amber-500');
            return false;
          }

          this.updateStatus('Iniciando LED...', 'bg-amber-400 animate-pulse');
          this.releaseHardware();

          let found = await this.tryActivateCameraWithTorch({
            audio: false,
            video: { facingMode: { ideal: 'environment' } }
          });

          if (!found && navigator.mediaDevices.enumerateDevices) {
            try {
              const devices = await navigator.mediaDevices.enumerateDevices();
              const videoInputs = devices.filter(d => d.kind === 'videoinput');

              const prioritized = videoInputs.sort((a, b) => {
                const la = (a.label || '').toLowerCase();
                const lb = (b.label || '').toLowerCase();
                const score = (l) => {
                  let s = 0;
                  if (l.includes('back') || l.includes('rear') || l.includes('trasera') || l.includes('environment')) s += 10;
                  if (l.includes('0') || l.includes('main') || l.includes('principal')) s += 5;
                  if (l.includes('wide') || l.includes('ultra') || l.includes('macro') || l.includes('tele') || l.includes('depth')) s -= 8;
                  if (l.includes('front') || l.includes('user') || l.includes('frontal')) s -= 20;
                  return s;
                };
                return score(lb) - score(la);
              });

              for (const dev of prioritized) {
                found = await this.tryActivateCameraWithTorch({
                  audio: false,
                  video: { deviceId: { exact: dev.deviceId } }
                });
                if (found) break;
              }
            } catch (e) {}
          }

          if (found) {
            this.stream = found.stream;
            this.track = found.track;
            this.hasHardwareTorch = true;
            if ('ImageCapture' in window) {
              try {
                this.imageCapture = new ImageCapture(this.track);
              } catch (e) {}
            }
            this.updateStatus('LED Trasero Activo', 'bg-emerald-400');
            return true;
          } else {
            this.hasHardwareTorch = false;
            this.updateStatus('Solo Pantalla', 'bg-amber-500');
            return false;
          }
        })();

        try {
          return await this.initPromise;
        } finally {
          this.initPromise = null;
        }
      }

      async setTorch(state, brightness = 1.0) {
        const targetState = Boolean(state) && brightness > 0.05;
        this.isTorchOn = targetState;
        const mode = this.outputModeSelect ? this.outputModeSelect.value : 'auto';

        if (this.beamIndicator && this.beamCore) {
          if (targetState) {
            this.beamIndicator.className = 'w-6 h-6 rounded-lg bg-amber-500/25 border border-amber-400 flex items-center justify-center transition-all duration-75';
            this.beamCore.className = 'w-3 h-3 rounded-full bg-white transition-all duration-75';
          } else {
            this.beamIndicator.className = 'w-6 h-6 rounded-lg bg-zinc-900 border border-zinc-700 flex items-center justify-center transition-all duration-75';
            this.beamCore.className = 'w-2.5 h-2.5 rounded-full bg-zinc-700 transition-all duration-75';
          }
        }

        if (mode !== 'screen') {
          if (targetState && (!this.hasHardwareTorch || !this.track || this.track.readyState !== 'live')) {
            await this.initHardware();
          }

          if (this.hasHardwareTorch && this.track && this.track.readyState === 'live') {
            try {
              await this.track.applyConstraints({ advanced: [{ torch: targetState }] });
            } catch (err) {
              if (this.imageCapture && typeof this.imageCapture.setOptions === 'function') {
                try {
                  await this.imageCapture.setOptions({ torch: targetState });
                } catch (e2) {}
              }
            }
          }
        } else if (this.hasHardwareTorch && this.track && this.track.readyState === 'live') {
          try {
            await this.track.applyConstraints({ advanced: [{ torch: false }] });
          } catch (e) {}
        }

        if (this.screenOverlay) {
          const useScreen = mode === 'screen' || (mode === 'auto' && !this.hasHardwareTorch);
          if (useScreen && targetState) {
            this.screenOverlay.style.opacity = String(Math.min(0.95, Math.max(0.25, brightness)));
          } else {
            this.screenOverlay.style.opacity = '0';
          }
        }
      }

      async runDiagnosticTest() {
        const ok = await this.initHardware();
        if (ok) {
          await this.setTorch(true);
          showToast('LED Trasero OK');
          setTimeout(() => this.setTorch(false), 550);
        } else {
          await this.setTorch(true);
          showToast('Flash de Pantalla OK');
          setTimeout(() => this.setTorch(false), 400);
        }
      }
    }

    /**
     * ============================================================================
     * 3. MOTOR DE ESTROBOSCOPIO (0.10 - 25 Hz) Y MICRÓFONO RÍTMICO UNIFICADO
     * ============================================================================
     */
    class StrobeAndAudioEngine {
      constructor(torchController) {
        this.torch = torchController;
        this.mode = 'off';
        this.frequencyHz = 8.0;
        this.strobeTimer = null;
        this.strobeState = false;

        this.tapTimestamps = [];

        this.audioCtx = null;
        this.micStream = null;
        this.analyser = null;
        this.dataArray = null;
        this.micAnimFrame = null;
        this.threshold = 0.60;
        this.rhythmPattern = 'single';
        this.lastBeatTime = 0;
        this.scheduledTimeouts = [];

        this.visCanvas = document.getElementById('audio-visualizer');
        this.visCtx = this.visCanvas ? this.visCanvas.getContext('2d') : null;

        this.setupUnifiedThresholdControl();
      }

      setThresholdFromPercent(rawPct) {
        const clamped = Math.max(10, Math.min(95, Math.round(rawPct)));
        this.threshold = clamped / 100;

        const bar = document.getElementById('mic-unified-bar');
        const line = document.getElementById('mic-threshold-line');
        const handle = document.getElementById('mic-threshold-handle');
        const disp = document.getElementById('threshold-val-display');

        if (bar) bar.setAttribute('aria-valuenow', String(clamped));
        if (line) line.style.left = `${clamped}%`;
        if (handle) handle.style.left = `${clamped}%`;
        if (disp) disp.textContent = `${clamped}%`;
      }

      setupUnifiedThresholdControl() {
        const bar = document.getElementById('mic-unified-bar');
        if (!bar) return;

        let dragging = false;

        const updateFromClientX = (clientX) => {
          const rect = bar.getBoundingClientRect();
          if (!rect.width) return;
          const ratio = (clientX - rect.left) / rect.width;
          this.setThresholdFromPercent(ratio * 100);
        };

        bar.addEventListener('pointerdown', (e) => {
          dragging = true;
          try { bar.setPointerCapture(e.pointerId); } catch (err) {}
          updateFromClientX(e.clientX);
        });

        bar.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          updateFromClientX(e.clientX);
        });

        const stopDrag = (e) => {
          if (!dragging) return;
          dragging = false;
          try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
        };

        bar.addEventListener('pointerup', stopDrag);
        bar.addEventListener('pointercancel', stopDrag);
      }

      updateModeUI() {
        const label = document.getElementById('torch-mode-label');
        const btnSteady = document.getElementById('btn-torch-steady');
        const steadySub = document.getElementById('steady-sub');
        const btnStrobe = document.getElementById('btn-torch-strobe');
        const strobeSub = document.getElementById('strobe-sub');

        btnSteady.classList.remove('active-amber');
        steadySub.textContent = 'OFF';
        steadySub.className = 'px-2.5 py-0.5 rounded-full bg-black/55 border border-white/10 text-[10px] font-mono-tech font-bold text-zinc-300';

        btnStrobe.classList.remove('active-emerald');
        strobeSub.textContent = 'OFF';
        strobeSub.className = 'px-2.5 py-0.5 rounded-full bg-black/55 border border-white/10 text-[10px] font-mono-tech font-bold text-zinc-300';

        if (this.mode === 'steady') {
          label.textContent = 'LINTERNA FIJA';
          label.className = 'text-sm font-extrabold tracking-tight text-amber-400';
          btnSteady.classList.add('active-amber');
          steadySub.textContent = 'ON';
          steadySub.className = 'px-2.5 py-0.5 rounded-full bg-black/40 border border-white/25 text-[10px] font-mono-tech font-bold text-white';
        } else if (this.mode === 'strobe') {
          label.textContent = `ESTROBO • ${formatHz(this.frequencyHz)}`;
          label.className = 'text-sm font-extrabold tracking-tight text-emerald-400';
          btnStrobe.classList.add('active-emerald');
          strobeSub.textContent = 'ON';
          strobeSub.className = 'px-2.5 py-0.5 rounded-full bg-black/40 border border-white/25 text-[10px] font-mono-tech font-bold text-white';
        } else if (this.mode === 'mic') {
          label.textContent = 'MICRÓFONO RÍTMICO';
          label.className = 'text-sm font-extrabold tracking-tight text-red-400';
        } else {
          label.textContent = 'APAGADO';
          label.className = 'text-sm font-extrabold tracking-tight text-white';
        }
      }

      clearStrobeTimer() {
        if (this.strobeTimer) {
          clearInterval(this.strobeTimer);
          this.strobeTimer = null;
        }
        this.strobeState = false;
      }

      clearScheduledPulses() {
        this.scheduledTimeouts.forEach(id => clearTimeout(id));
        this.scheduledTimeouts = [];
      }

      stopAll() {
        this.clearStrobeTimer();
        this.clearScheduledPulses();
        if (this.mode === 'mic') {
          this.stopMicrophone();
        }
        this.mode = 'off';
        this.torch.setTorch(false);
        this.updateModeUI();
      }

      async toggleSteady() {
        if (this.mode === 'steady') {
          this.stopAll();
          return;
        }
        this.clearStrobeTimer();
        this.clearScheduledPulses();
        if (this.mode === 'mic') this.stopMicrophone();

        this.mode = 'steady';
        this.updateModeUI();
        await this.torch.initHardware();
        await this.torch.setTorch(true);
      }

      async toggleStrobe() {
        if (this.mode === 'strobe') {
          this.stopAll();
          return;
        }
        this.clearStrobeTimer();
        this.clearScheduledPulses();
        if (this.mode === 'mic') this.stopMicrophone();

        this.mode = 'strobe';
        this.updateModeUI();
        await this.torch.initHardware();
        this.startStrobeLoop();
      }

      startStrobeLoop() {
        this.clearStrobeTimer();
        const hz = Math.max(0.1, Math.min(25, this.frequencyHz));
        const halfPeriodMs = Math.max(20, Math.round(500 / hz));

        this.strobeState = true;
        this.torch.setTorch(true);

        this.strobeTimer = setInterval(() => {
          if (this.mode !== 'strobe') {
            this.clearStrobeTimer();
            return;
          }
          this.strobeState = !this.strobeState;
          this.torch.setTorch(this.strobeState);
        }, halfPeriodMs);
      }

      setFrequency(rawVal) {
        const hz = Math.max(0.1, Math.min(25, parseFloat(rawVal) || 8.0));
        this.frequencyHz = Math.round(hz * 100) / 100;

        const slider = document.getElementById('strobe-freq-slider');
        if (slider) slider.value = String(this.frequencyHz);

        const hzDisplay = document.getElementById('freq-hz-display');
        const bpmDisplay = document.getElementById('freq-bpm-display');
        const intDisplay = document.getElementById('freq-interval-display');

        if (hzDisplay) hzDisplay.textContent = formatHz(this.frequencyHz);
        if (bpmDisplay) bpmDisplay.textContent = `${Math.round(this.frequencyHz * 60)} BPM`;
        if (intDisplay) intDisplay.textContent = `(${(1 / this.frequencyHz).toFixed(2)}s)`;

        if (this.mode === 'strobe') {
          this.updateModeUI();
          this.startStrobeLoop();
        }
      }

      registerTapTempo() {
        const now = performance.now();
        if (this.tapTimestamps.length > 0 && now - this.tapTimestamps[this.tapTimestamps.length - 1] > 11000) {
          this.tapTimestamps = [];
        }
        this.tapTimestamps.push(now);
        if (this.tapTimestamps.length > 5) {
          this.tapTimestamps.shift();
        }

        const sub = document.getElementById('tap-tempo-sub');
        if (this.tapTimestamps.length < 2) {
          if (sub) sub.textContent = '1er...';
          return;
        }

        let totalInterval = 0;
        for (let i = 1; i < this.tapTimestamps.length; i++) {
          totalInterval += (this.tapTimestamps[i] - this.tapTimestamps[i - 1]);
        }
        const avgIntervalSec = (totalInterval / (this.tapTimestamps.length - 1)) / 1000;
        const calculatedHz = Math.max(0.1, Math.min(25, 1 / avgIntervalSec));

        this.setFrequency(calculatedHz);
        if (sub) sub.textContent = `${avgIntervalSec.toFixed(2)}s`;
      }

      async toggleMicrophone() {
        if (this.mode === 'mic') {
          this.stopAll();
          return;
        }

        this.clearStrobeTimer();
        this.clearScheduledPulses();

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showToast('Micrófono no disponible');
            return;
          }

          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });

          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioCtx();
          if (this.audioCtx.state === 'suspended') {
            await this.audioCtx.resume();
          }

          this.micStream = stream;
          const source = this.audioCtx.createMediaStreamSource(stream);
          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 256;
          this.analyser.smoothingTimeConstant = 0.55;
          source.connect(this.analyser);

          this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
          this.mode = 'mic';
          this.updateModeUI();

          const btnMic = document.getElementById('btn-mic-toggle');
          const micText = document.getElementById('mic-btn-text');
          const placeholder = document.getElementById('mic-placeholder');
          if (btnMic) btnMic.classList.add('active-red');
          if (micText) micText.textContent = 'Desactivar';
          if (placeholder) placeholder.style.display = 'none';

          await this.torch.initHardware();
          if (this.rhythmPattern === 'inverted') {
            this.torch.setTorch(true);
          }

          this.runAudioLoop();
        } catch (err) {
          showToast('Permiso de micrófono denegado');
        }
      }

      stopMicrophone() {
        if (this.micAnimFrame) {
          cancelAnimationFrame(this.micAnimFrame);
          this.micAnimFrame = null;
        }
        if (this.micStream) {
          this.micStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          this.micStream = null;
        }
        if (this.audioCtx) {
          try { this.audioCtx.close(); } catch (e) {}
          this.audioCtx = null;
        }
        this.analyser = null;

        const btnMic = document.getElementById('btn-mic-toggle');
        const micText = document.getElementById('mic-btn-text');
        const placeholder = document.getElementById('mic-placeholder');
        const levelBar = document.getElementById('mic-level-bar');
        const levelPct = document.getElementById('mic-level-percent');

        if (btnMic) btnMic.classList.remove('active-red');
        if (micText) micText.textContent = 'Activar Micrófono';
        if (placeholder) placeholder.style.display = 'flex';
        if (levelBar) levelBar.style.width = '0%';
        if (levelPct) levelPct.textContent = '0%';

        if (this.visCtx && this.visCanvas) {
          this.visCtx.clearRect(0, 0, this.visCanvas.width, this.visCanvas.height);
        }
      }

      triggerRhythmHit(intensity) {
        const pattern = this.rhythmPattern;
        const badge = document.getElementById('beat-badge');
        if (badge) {
          badge.className = 'px-1.5 py-0.5 rounded text-[9px] font-mono-tech font-bold bg-amber-500 text-black border border-amber-300 transition-colors shrink-0';
          clearTimeout(this.__badgeTimer);
          this.__badgeTimer = setTimeout(() => {
            badge.className = 'px-1.5 py-0.5 rounded text-[9px] font-mono-tech font-bold bg-zinc-800 text-zinc-400 border border-zinc-700 transition-colors shrink-0';
          }, 90);
        }

        if (pattern === 'proportional') {
          return;
        }

        this.clearScheduledPulses();

        if (pattern === 'inverted') {
          this.torch.setTorch(false);
          const t1 = setTimeout(() => {
            if (this.mode === 'mic' && this.rhythmPattern === 'inverted') {
              this.torch.setTorch(true);
            }
          }, 95);
          this.scheduledTimeouts.push(t1);
          return;
        }

        const counts = { single: 1, double: 2, triple: 3, quad: 4 };
        const pulses = counts[pattern] || 1;
        const stepMs = pulses === 1 ? 75 : Math.max(48, Math.floor(240 / pulses));
        const onMs = Math.max(26, Math.floor(stepMs * 0.52));

        for (let i = 0; i < pulses; i++) {
          const startDelay = i * stepMs;
          const tOn = setTimeout(() => {
            if (this.mode === 'mic') this.torch.setTorch(true, intensity);
          }, startDelay);
          const tOff = setTimeout(() => {
            if (this.mode === 'mic') this.torch.setTorch(false);
          }, startDelay + onMs);
          this.scheduledTimeouts.push(tOn, tOff);
        }
      }

      runAudioLoop() {
        const loop = () => {
          if (this.mode !== 'mic' || !this.analyser) return;

          this.analyser.getByteFrequencyData(this.dataArray);

          let weightedSum = 0;
          let weightTotal = 0;
          const len = Math.min(48, this.dataArray.length);
          for (let i = 0; i < len; i++) {
            const w = i < 14 ? 2.2 : 1.0;
            weightedSum += (this.dataArray[i] / 255) * w;
            weightTotal += w;
          }
          const level = Math.min(1, (weightedSum / weightTotal) * 1.45);
          const pct = Math.round(level * 100);

          const levelBar = document.getElementById('mic-level-bar');
          const levelPct = document.getElementById('mic-level-percent');
          if (levelBar) levelBar.style.width = `${pct}%`;
          if (levelPct) levelPct.textContent = `${pct}%`;

          if (this.rhythmPattern === 'proportional') {
            const triggerFloor = this.threshold * 0.45;
            if (level >= triggerFloor) {
              const normBright = Math.min(1, (level - triggerFloor) / Math.max(0.1, 1 - triggerFloor));
              this.torch.setTorch(true, 0.25 + normBright * 0.75);
            } else {
              this.torch.setTorch(false);
            }
          } else {
            const now = performance.now();
            if (level >= this.threshold && now - this.lastBeatTime > 135) {
              this.lastBeatTime = now;
              this.triggerRhythmHit(level);
            }
          }

          this.drawVisualizer(level);
          this.micAnimFrame = requestAnimationFrame(loop);
        };

        this.micAnimFrame = requestAnimationFrame(loop);
      }

      drawVisualizer(level) {
        if (!this.visCtx || !this.visCanvas || !this.dataArray) return;
        const ctx = this.visCtx;
        const W = this.visCanvas.width;
        const H = this.visCanvas.height;

        ctx.clearRect(0, 0, W, H);

        const bars = 40;
        const barW = (W / bars) - 2;
        for (let i = 0; i < bars; i++) {
          const val = (this.dataArray[i] || 0) / 255;
          const barH = Math.max(2, val * (H - 8));
          const x = i * (barW + 2) + 1;
          const y = H - barH;

          ctx.fillStyle = level >= this.threshold ? '#f59e0b' : '#3f3f46';
          ctx.beginPath();
          ctx.roundRect(x, y, barW, barH, 2);
          ctx.fill();
        }

        const threshY = H - this.threshold * (H - 8);
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(0, threshY);
        ctx.lineTo(W, threshY);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    /**
     * ============================================================================
     * 4. SINTETIZADOR DE AUDIO METÁLICO PROCEDURAL PARA EL ZIPPO (WEB AUDIO API)
     * ============================================================================
     */
    class ProceduralZippoAudio {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      ensureCtx() {
        if (!this.enabled) return null;
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        } catch (e) {
          return null;
        }
      }

      playOpenClink() {
        const ctx = this.ensureCtx();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const freqs = [2450, 3890, 5620];
          freqs.forEach((f, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = idx === 0 ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(f, now);
            osc.frequency.exponentialRampToValueAtTime(f * 0.96, now + 0.16);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.14 / (idx + 1), now + 0.004);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18 - idx * 0.03);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
          });
        } catch (e) {}
      }

      playCloseClack() {
        const ctx = this.ensureCtx();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(980, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.055);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.065);
        } catch (e) {}
      }

      playFlintStrike() {
        const ctx = this.ensureCtx();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const bufferSize = Math.floor(ctx.sampleRate * 0.065);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
          }

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(4200, now);
          filter.Q.setValueAtTime(3.2, now);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
        } catch (e) {}
      }

      playIgnitionWhoosh() {
        const ctx = this.ensureCtx();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const bufferSize = Math.floor(ctx.sampleRate * 0.14);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
          }

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(520, now);
          filter.frequency.exponentialRampToValueAtTime(160, now + 0.14);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
        } catch (e) {}
      }
    }

    /**
     * ============================================================================
     * 5. SIMULADOR DE MECHERO ZIPPO NEGRO MATE SATINADO (CANVAS 2D)
     * ============================================================================
     */
    class MatteZippoSimulator {
      constructor(torchController, zippoAudio) {
        this.torch = torchController;
        this.audio = zippoAudio;

        this.canvas = document.getElementById('zippo-canvas');
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.card = document.getElementById('zippoCard');
        this.wrapper = document.getElementById('zippoCanvasWrapper');

        this.logicalW = 380;
        this.logicalH = 470;
        this.isVisible = false;

        this.isOpen = false;
        this.lidAngle = 0;
        this.targetLidAngle = 0;
        this.lidVelocity = 0;

        this.isLit = false;
        this.isFullscreen = false;
        this.wheelAngle = 0;
        this.wheelVelocity = 0;

        this.accelX = 0;
        this.tiltX = 0;
        this.speed = 0;
        this.stretch = 1.0;

        this.sensorsEnabled = false;
        this.lastShakeTime = 0;
        this.orientationHandler = (e) => this.handleOrientation(e);
        this.motionHandler = (e) => this.handleMotion(e);

        this.sparks = [];
        this.smoke = [];
        this.flameTime = 0;

        this.stickerStorageKey = 'strobezippo_custom_sticker_v1';
        this.stickerImage = null;

        this.pointerDown = false;
        this.startX = 0;
        this.startY = 0;
        this.lastX = 0;
        this.lastY = 0;
        this.dragMode = null;

        this.loadSavedSticker();
        this.setupEvents();
        this.clearCanvasBuffer();

        window.addEventListener('resize', () => {
          if (!this.isVisible) return;
          this.resizeCanvas();
          this.render();
        });
      }

      clearCanvasBuffer() {
        if (!this.ctx || !this.canvas) return;
        this.ctx.save();
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.restore();
      }

      setVisible(visible) {
        this.isVisible = Boolean(visible);
        if (!this.isVisible) {
          this.pointerDown = false;
          this.dragMode = null;
          if (this.isFullscreen) {
            this.restoreNormalView(true);
          }
          this.clearCanvasBuffer();
        } else {
          if (this.card) void this.card.offsetHeight;
          this.resizeCanvas();
          this.render();
        }
      }

      resizeCanvas() {
        if (!this.canvas || !this.ctx || !this.isVisible) return;

        const targetEl = this.wrapper || this.card || this.canvas;
        const rect = targetEl.getBoundingClientRect();

        let w = this.isFullscreen
          ? Math.floor(window.innerWidth || rect.width || 380)
          : Math.floor(rect.width || Math.min(416, (window.innerWidth || 412) - 24));

        let h = this.isFullscreen
          ? Math.floor(window.innerHeight || rect.height || 640)
          : Math.floor(rect.height || 470);

        if (w < 240) w = Math.max(280, Math.min(416, (window.innerWidth || 412) - 24));
        if (h < 280) h = 470;

        this.logicalW = w;
        this.logicalH = h;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const targetCanvasW = Math.floor(w * dpr);
        const targetCanvasH = Math.floor(h * dpr);

        if (this.canvas.width !== targetCanvasW || this.canvas.height !== targetCanvasH) {
          this.canvas.width = targetCanvasW;
          this.canvas.height = targetCanvasH;
        }
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      restoreNormalView(skipRender = false) {
        this.isFullscreen = false;
        document.body.classList.remove('zippo-fullscreen-mode');

        const toolbar = document.getElementById('zippo-top-toolbar');
        const exitBtn = document.getElementById('btn-exit-fullscreen');

        if (toolbar) toolbar.style.display = '';
        if (exitBtn) exitBtn.classList.add('hidden');

        if (this.card) void this.card.offsetHeight;
        if (this.wrapper) void this.wrapper.offsetHeight;

        lockPortraitOrientation();
        if (!skipRender && this.isVisible) {
          this.resizeCanvas();
          this.render();
        } else {
          this.clearCanvasBuffer();
        }
      }

      toggleFullscreen(forceState = null) {
        const nextState = forceState !== null ? forceState : !this.isFullscreen;

        if (nextState) {
          if (!this.isVisible) return;
          this.isFullscreen = true;
          document.body.classList.add('zippo-fullscreen-mode');
          const exitBtn = document.getElementById('btn-exit-fullscreen');
          if (exitBtn) exitBtn.classList.remove('hidden');

          if (this.card) void this.card.offsetHeight;
          this.resizeCanvas();
          this.render();

          const el = document.documentElement;
          try {
            if (el.requestFullscreen) {
              el.requestFullscreen().then(() => {
                lockPortraitOrientation();
                if (this.isVisible) {
                  this.resizeCanvas();
                  this.render();
                }
              }).catch(() => {});
            } else if (el.webkitRequestFullscreen) {
              el.webkitRequestFullscreen();
            }
          } catch (e) {}

          lockPortraitOrientation();
        } else {
          this.restoreNormalView(false);
          try {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
              if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
              } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
              }
            }
          } catch (e) {}
        }
      }

      getGeometry() {
        const W = Math.max(280, this.logicalW || 380);
        const H = Math.max(360, this.logicalH || 470);

        const bodyUnitW = 176;
        const bodyUnitH = 196;
        const lidUnitH = 112;
        const cornerUnitR = 16;
        const totalModelUnitH = 481;

        const topMargin = this.isFullscreen ? 44 : 16;
        const bottomMargin = this.isFullscreen ? 20 : 18;
        const usableH = Math.max(240, H - topMargin - bottomMargin);

        const widthRatio = this.isFullscreen ? 0.80 : 0.72;
        const maxScaleByWidth = (W * widthRatio) / bodyUnitW;
        const maxScaleByHeight = usableH / totalModelUnitH;
        const scale = Math.min(maxScaleByWidth, maxScaleByHeight);

        const bodyW = bodyUnitW * scale;
        const bodyH = bodyUnitH * scale;
        const lidH = lidUnitH * scale;
        const cornerR = cornerUnitR * scale;

        const bodyCenterX = W * 0.5;
        const bodyX = bodyCenterX - bodyW * 0.5;

        const baseY = H - bottomMargin;
        const bodyY = baseY - bodyH;

        const hingeX = bodyX;
        const hingeY = bodyY;

        return { W, H, scale, bodyX, bodyY, bodyW, bodyH, lidH, cornerR, hingeX, hingeY, topMargin };
      }

      openLid() {
        if (this.isOpen) return;
        this.isOpen = true;
        this.targetLidAngle = -2.01;
        this.lidVelocity = -7.2;
        this.audio.playOpenClink();
      }

      closeLid() {
        if (!this.isOpen) return;
        this.isOpen = false;
        this.targetLidAngle = 0;
        this.lidVelocity = 7.8;
        if (this.isLit) {
          this.extinguishFlame();
        }
        this.audio.playCloseClack();
      }

      strikeFlint(impulse = 1) {
        if (!this.isOpen) {
          this.openLid();
          return;
        }

        this.wheelVelocity = Math.max(this.wheelVelocity, 16 * impulse);
        this.audio.playFlintStrike();

        const g = this.getGeometry();
        const wheelCenterX = g.bodyX + g.bodyW * 0.85;
        const wheelCenterY = g.bodyY - g.bodyH * 0.19;

        const sparkCount = 16 + Math.floor(Math.random() * 10);
        for (let i = 0; i < sparkCount; i++) {
          const angle = -Math.PI * (0.55 + Math.random() * 0.45);
          const speed = (2.0 + Math.random() * 4.5) * g.scale;
          this.sparks.push({
            x: wheelCenterX - 5 * g.scale,
            y: wheelCenterY - 4 * g.scale,
            vx: Math.cos(angle) * speed - 1.1 * g.scale,
            vy: Math.sin(angle) * speed - 1.4 * g.scale,
            life: 1.0,
            decay: 0.035 + Math.random() * 0.03,
            size: Math.max(1.5, (1.5 + Math.random() * 1.6) * g.scale)
          });
        }

        if (!this.isLit && impulse > 0.35) {
          this.isLit = true;
          this.stretch = 0.55;
          this.audio.playIgnitionWhoosh();
        }
      }

      extinguishFlame() {
        if (!this.isLit) return;
        this.isLit = false;

        const g = this.getGeometry();
        const wickX = g.bodyX + g.bodyW * 0.48;
        const wickY = g.bodyY - g.bodyH * 0.30;
        for (let i = 0; i < 14; i++) {
          this.smoke.push({
            x: wickX + (Math.random() - 0.5) * 6 * g.scale,
            y: wickY - i * 3.5 * g.scale,
            vx: (Math.random() - 0.5) * 0.75 * g.scale,
            vy: (-1.0 - Math.random() * 0.9) * g.scale,
            radius: Math.max(2, (3 + Math.random() * 4.5) * g.scale),
            alpha: 0.48
          });
        }
      }

      updateSensorsUI(isOn) {
        const btn = document.getElementById('btn-zippo-sensors');
        const txt = document.getElementById('zippo-sensors-text');
        if (btn) btn.classList.toggle('active-emerald', isOn);
        if (txt) txt.textContent = isOn ? 'Sensores: ON' : 'Sensores: OFF';
      }

      async toggleSensors() {
        if (this.sensorsEnabled) {
          this.sensorsEnabled = false;
          window.removeEventListener('deviceorientation', this.orientationHandler);
          window.removeEventListener('devicemotion', this.motionHandler);
          this.accelX = 0;
          this.updateSensorsUI(false);
          showToast('Sensores OFF');
          return;
        }

        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            const res = await DeviceMotionEvent.requestPermission();
            if (res !== 'granted') {
              showToast('Permiso denegado');
              return;
            }
          }
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            await DeviceOrientationEvent.requestPermission();
          }

          if (typeof window.DeviceMotionEvent === 'undefined' && typeof window.DeviceOrientationEvent === 'undefined') {
            showToast('Sin sensores');
            return;
          }

          window.addEventListener('deviceorientation', this.orientationHandler);
          window.addEventListener('devicemotion', this.motionHandler);

          this.sensorsEnabled = true;
          this.updateSensorsUI(true);
          showToast('Sensores ON');
        } catch (err) {
          showToast('Sensores bloqueados');
        }
      }

      handleOrientation(e) {
        if (!this.sensorsEnabled || !this.isVisible) return;
        const gamma = e.gamma || 0;
        this.accelX = Math.max(-7.5, Math.min(7.5, (gamma / 45) * 6.0));
      }

      handleMotion(e) {
        if (!this.sensorsEnabled || !this.isVisible) return;
        const accG = e.accelerationIncludingGravity;
        const acc = e.acceleration;
        if (accG && accG.x !== null) {
          this.accelX = Math.max(-9.8, Math.min(9.8, accG.x));
        }

        const linX = acc && acc.x !== null ? acc.x : 0;
        const linY = acc && acc.y !== null ? acc.y : 0;
        const linZ = acc && acc.z !== null ? acc.z : 0;
        this.speed = Math.hypot(linX, linY, linZ);

        const now = performance.now();
        if (Math.abs(linX) > 13.5 && now - this.lastShakeTime > 520) {
          this.lastShakeTime = now;
          if (!this.isOpen) {
            this.openLid();
          } else if (Math.abs(linX) > 17.5) {
            this.closeLid();
          }
        }

        if (this.isLit && this.speed > 23) {
          this.extinguishFlame();
        }
      }

      setupEvents() {
        if (!this.canvas) return;

        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
          return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const onDown = (e) => {
          if (!this.isVisible) return;
          const pos = getPos(e);
          this.pointerDown = true;
          this.startX = pos.x;
          this.startY = pos.y;
          this.lastX = pos.x;
          this.lastY = pos.y;

          const g = this.getGeometry();
          const wheelX = g.bodyX + g.bodyW * 0.85;
          const wheelY = g.bodyY - g.bodyH * 0.19;
          const distWheel = Math.hypot(pos.x - wheelX, pos.y - wheelY);

          if (this.isOpen && distWheel < g.bodyW * 0.34) {
            this.dragMode = 'wheel';
          } else if (this.isLit && pos.y < g.bodyY - g.bodyH * 0.22 && Math.abs(pos.x - (g.bodyX + g.bodyW * 0.5)) < g.bodyW * 0.45) {
            this.dragMode = 'flame';
          } else {
            this.dragMode = 'lid';
          }
        };

        const onMove = (e) => {
          if (!this.isVisible) return;
          const pos = getPos(e);

          if (!this.sensorsEnabled && !this.pointerDown && e.type === 'mousemove') {
            const g = this.getGeometry();
            const normX = ((pos.x - g.W * 0.5) / (g.W * 0.5)) * 3.2;
            this.accelX = Math.max(-4.5, Math.min(4.5, normX));
            this.speed = Math.abs(pos.x - this.lastX) * 0.35;
          }

          if (!this.pointerDown) {
            this.lastX = pos.x;
            this.lastY = pos.y;
            return;
          }

          const dx = pos.x - this.lastX;
          const dy = pos.y - this.lastY;

          if (this.dragMode === 'wheel') {
            if (dy > 2 || Math.abs(dx) > 3) {
              this.wheelAngle += (dy + Math.abs(dx)) * 0.08;
              if (pos.y - this.startY > 14) {
                this.strikeFlint(1.0);
                this.dragMode = 'done';
              }
            }
          } else if (this.dragMode === 'lid') {
            const totalDx = pos.x - this.startX;
            const totalDy = pos.y - this.startY;
            if (!this.isOpen && (totalDx < -25 || totalDy < -25)) {
              this.openLid();
              this.dragMode = 'done';
            } else if (this.isOpen && (totalDx > 28 || totalDy > 28)) {
              this.closeLid();
              this.dragMode = 'done';
            }
          } else if (this.dragMode === 'flame') {
            this.accelX = Math.max(-6, Math.min(6, -dx * 0.45));
            this.speed = Math.hypot(dx, dy) * 0.5;
            if (Math.hypot(pos.x - this.startX, pos.y - this.startY) > 48) {
              this.extinguishFlame();
              this.dragMode = 'done';
            }
          }

          this.lastX = pos.x;
          this.lastY = pos.y;
        };

        const onUp = () => {
          if (!this.pointerDown) return;
          this.pointerDown = false;
          if (!this.isVisible) {
            this.dragMode = null;
            return;
          }
          const dist = Math.hypot(this.lastX - this.startX, this.lastY - this.startY);

          if (dist < 10) {
            if (this.dragMode === 'wheel') {
              this.strikeFlint(1.0);
            } else if (this.dragMode === 'flame') {
              this.extinguishFlame();
            } else if (this.dragMode === 'lid') {
              if (!this.isOpen) {
                this.openLid();
              } else {
                this.closeLid();
              }
            }
          }
          this.dragMode = null;
        };

        this.canvas.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        this.canvas.addEventListener('touchstart', onDown, { passive: true });
        this.canvas.addEventListener('touchmove', onMove, { passive: true });
        this.canvas.addEventListener('touchend', onUp);
      }

      updatePhysics(dt) {
        if (!this.isVisible) return;
        this.flameTime += dt;

        const lidStiffness = 155;
        const lidDamping = 11.5;
        const lidForce = (this.targetLidAngle - this.lidAngle) * lidStiffness;
        this.lidVelocity += lidForce * dt;
        this.lidVelocity *= Math.exp(-lidDamping * dt);
        this.lidAngle += this.lidVelocity * dt;

        if (this.lidAngle > 0.02) {
          this.lidAngle = 0;
          this.lidVelocity = -this.lidVelocity * 0.25;
        } else if (this.lidAngle < -2.18) {
          this.lidAngle = -2.18;
          this.lidVelocity = -this.lidVelocity * 0.35;
        }

        if (this.wheelVelocity > 0.01) {
          this.wheelAngle += this.wheelVelocity * dt;
          this.wheelVelocity *= Math.exp(-6 * dt);
        }

        const targetTiltX = -this.accelX * 0.14;
        this.tiltX += (targetTiltX - this.tiltX) * 0.12;

        const targetStretch = 1 + Math.min(0.22, this.speed * 0.015);
        this.stretch += (targetStretch - this.stretch) * 0.14;
        this.speed *= 0.90;

        for (let i = this.sparks.length - 1; i >= 0; i--) {
          const s = this.sparks[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.22;
          s.life -= s.decay;
          if (s.life <= 0) this.sparks.splice(i, 1);
        }

        for (let i = this.smoke.length - 1; i >= 0; i--) {
          const sm = this.smoke[i];
          sm.x += sm.vx + Math.sin(this.flameTime * 4 + i) * 0.2;
          sm.y += sm.vy;
          sm.radius += 0.1;
          sm.alpha -= 0.008;
          if (sm.alpha <= 0) this.smoke.splice(i, 1);
        }
      }

      render() {
        const ctx = this.ctx;
        if (!ctx) return;

        if (!this.isVisible) {
          this.clearCanvasBuffer();
          return;
        }

        const g = this.getGeometry();
        if (!Number.isFinite(g.W) || !Number.isFinite(g.H) || g.W <= 0 || g.H <= 0) return;

        ctx.clearRect(0, 0, g.W, g.H);

        if (this.isLit) {
          const wickX = g.bodyX + g.bodyW * 0.48;
          const wickY = g.bodyY - g.bodyH * 0.34;
          const rOuter = Math.max(30, g.bodyW * 1.95);
          const glow = ctx.createRadialGradient(wickX, wickY - 45 * g.scale, 8 * g.scale, wickX, wickY - 45 * g.scale, rOuter);
          glow.addColorStop(0, 'rgba(255, 165, 45, 0.32)');
          glow.addColorStop(0.45, 'rgba(255, 106, 0, 0.13)');
          glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, g.W, g.H);
        }

        this.drawChimneyBackAndWick(ctx, g);

        if (this.isLit) {
          this.drawNaturalFlame(ctx, g);
        }

        this.drawChromeInsertFront(ctx, g);
        this.drawMatteBody(ctx, g);
        this.drawMatteLid(ctx, g);
        this.drawHinge(ctx, g);
        this.drawParticles(ctx);
      }

      drawChimneyBackAndWick(ctx, g) {
        const insX = g.bodyX + g.bodyW * 0.18;
        const insW = g.bodyW * 0.64;
        const insH = g.bodyH * 0.34;
        const insY = g.bodyY - insH + 4 * g.scale;
        const chimX = insX + insW * 0.14;
        const chimW = insW * 0.68;

        ctx.save();
        ctx.fillStyle = this.isLit ? '#0c1938' : '#090d16';
        ctx.beginPath();
        ctx.roundRect(chimX + 1.5 * g.scale, insY + 1 * g.scale, Math.max(4, chimW - 3 * g.scale), insH + 2 * g.scale, [2 * g.scale, 2 * g.scale, 0, 0]);
        ctx.fill();

        const wickX = chimX + chimW * 0.5;
        ctx.strokeStyle = this.isLit ? '#60a5fa' : '#cbd5e1';
        ctx.lineWidth = Math.max(2, 3.2 * g.scale);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(wickX, insY + insH * 0.45);
        ctx.lineTo(wickX, insY + insH * 0.08);
        ctx.stroke();
        ctx.restore();
      }

      drawChromeInsertFront(ctx, g) {
        const insX = g.bodyX + g.bodyW * 0.18;
        const insW = g.bodyW * 0.64;
        const insH = g.bodyH * 0.34;
        const insY = g.bodyY - insH + 4 * g.scale;

        ctx.save();

        ctx.fillStyle = '#cbd5e1';
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = Math.max(1, 1.2 * g.scale);
        ctx.beginPath();
        ctx.moveTo(g.bodyX + g.bodyW * 0.04, g.bodyY + 2 * g.scale);
        ctx.lineTo(g.bodyX + g.bodyW * 0.04, g.bodyY - insH * 0.45);
        ctx.quadraticCurveTo(g.bodyX + g.bodyW * 0.13, g.bodyY - insH * 0.55, g.bodyX + g.bodyW * 0.22, g.bodyY - insH * 0.25);
        ctx.lineTo(g.bodyX + g.bodyW * 0.22, g.bodyY + 2 * g.scale);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(g.bodyX + g.bodyW * 0.11, g.bodyY - insH * 0.26, Math.max(2, g.bodyW * 0.032), 0, Math.PI * 2);
        ctx.fillStyle = '#94a3b8';
        ctx.fill();
        ctx.stroke();

        const wheelCenterX = g.bodyX + g.bodyW * 0.85;
        const wheelCenterY = g.bodyY - insH * 0.56;
        const wheelRadius = Math.max(6, g.bodyW * 0.135);

        const tubeGrad = ctx.createLinearGradient(wheelCenterX - wheelRadius * 0.5, 0, wheelCenterX + wheelRadius * 0.5, 0);
        tubeGrad.addColorStop(0, '#475569');
        tubeGrad.addColorStop(0.5, '#cbd5e1');
        tubeGrad.addColorStop(1, '#334155');
        ctx.fillStyle = tubeGrad;
        ctx.fillRect(wheelCenterX - wheelRadius * 0.48, wheelCenterY + wheelRadius * 0.55, wheelRadius * 0.96, insH * 0.45);

        ctx.save();
        ctx.translate(wheelCenterX, wheelCenterY);
        ctx.rotate(this.wheelAngle);

        const teeth = 30;
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        for (let i = 0; i < teeth; i++) {
          const a = (i / teeth) * Math.PI * 2;
          const rOuter = wheelRadius + 2.2 * g.scale;
          const rInner = Math.max(2, wheelRadius - 1 * g.scale);
          ctx.lineTo(Math.cos(a) * rOuter, Math.sin(a) * rOuter);
          ctx.lineTo(Math.cos(a + 0.105) * rInner, Math.sin(a + 0.105) * rInner);
        }
        ctx.closePath();
        ctx.fill();

        const wheelGrad = ctx.createRadialGradient(-2, -2, 1, 0, 0, wheelRadius);
        wheelGrad.addColorStop(0, '#94a3b8');
        wheelGrad.addColorStop(0.7, '#475569');
        wheelGrad.addColorStop(1, '#1e293b');
        ctx.fillStyle = wheelGrad;
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(2, wheelRadius - 1 * g.scale), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const earGrad = ctx.createLinearGradient(insX + insW * 0.7, wheelCenterY - wheelRadius, insX + insW + 18 * g.scale, wheelCenterY + wheelRadius);
        earGrad.addColorStop(0, '#e2e8f0');
        earGrad.addColorStop(0.5, '#94a3b8');
        earGrad.addColorStop(1, '#475569');
        ctx.fillStyle = earGrad;
        ctx.beginPath();
        ctx.moveTo(insX + insW * 0.78, insY + insH * 0.08);
        ctx.lineTo(wheelCenterX + 3 * g.scale, wheelCenterY - wheelRadius * 0.65);
        ctx.arc(wheelCenterX, wheelCenterY, wheelRadius * 0.68, -0.6, 1.3);
        ctx.lineTo(insX + insW * 0.78, insY + insH * 0.78);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = Math.max(0.8, 1 * g.scale);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(wheelCenterX, wheelCenterY, Math.max(2, wheelRadius * 0.34), 0, Math.PI * 2);
        ctx.fillStyle = '#cbd5e1';
        ctx.fill();
        ctx.stroke();

        const chimX = insX + insW * 0.14;
        const chimW = insW * 0.68;
        const holeR = Math.max(1.5, chimW * 0.074);
        const cols = [chimX + chimW * 0.16, chimX + chimW * 0.50, chimX + chimW * 0.84];
        const rows = [insY + insH * 0.22, insY + insH * 0.52, insY + insH * 0.82];

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(chimX, insY, chimW, insH + 4 * g.scale, [2 * g.scale, 2 * g.scale, 0, 0]);

        rows.forEach((ry, rIdx) => {
          cols.forEach((cx, cIdx) => {
            if (rIdx === 1 && cIdx === 1) return;
            ctx.moveTo(cx + holeR, ry);
            ctx.arc(cx, ry, holeR, 0, Math.PI * 2, true);
          });
        });
        ctx.moveTo(cols[1] + holeR, rows[1]);
        ctx.arc(cols[1], rows[1], holeR, 0, Math.PI * 2, true);
        ctx.clip();

        const chimGrad = ctx.createLinearGradient(chimX, insY, chimX + chimW, insY);
        chimGrad.addColorStop(0.00, '#334155');
        chimGrad.addColorStop(0.14, '#94a3b8');
        chimGrad.addColorStop(0.32, '#e2e8f0');
        chimGrad.addColorStop(0.52, '#cbd5e1');
        chimGrad.addColorStop(0.78, '#94a3b8');
        chimGrad.addColorStop(0.92, '#64748b');
        chimGrad.addColorStop(1.00, '#1e293b');

        ctx.fillStyle = chimGrad;
        ctx.fillRect(chimX, insY, chimW, insH + 4 * g.scale);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 0.7;
        for (let y = insY + 2; y < insY + insH; y += 3) {
          ctx.beginPath();
          ctx.moveTo(chimX, y);
          ctx.lineTo(chimX + chimW, y);
          ctx.stroke();
        }

        if (this.isLit) {
          const metalWarmGlow = ctx.createLinearGradient(0, insY, 0, insY + insH * 0.55);
          metalWarmGlow.addColorStop(0, 'rgba(255, 190, 90, 0.35)');
          metalWarmGlow.addColorStop(1, 'rgba(255, 190, 90, 0)');
          ctx.fillStyle = metalWarmGlow;
          ctx.fillRect(chimX, insY, chimW, insH * 0.55);
        }
        ctx.restore();

        ctx.strokeStyle = this.isLit ? 'rgba(255, 235, 190, 0.85)' : 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = Math.max(1, 1.2 * g.scale);
        ctx.beginPath();
        ctx.moveTo(chimX + 1 * g.scale, insY + 0.6 * g.scale);
        ctx.lineTo(chimX + chimW - 1 * g.scale, insY + 0.6 * g.scale);
        ctx.stroke();

        ctx.restore();
      }

      drawMatteBody(ctx, g) {
        ctx.save();
        const { bodyX, bodyY, bodyW, bodyH, cornerR, scale } = g;

        const matteGrad = ctx.createLinearGradient(bodyX, bodyY, bodyX + bodyW, bodyY);
        matteGrad.addColorStop(0.00, '#090a0c');
        matteGrad.addColorStop(0.06, '#383c44');
        matteGrad.addColorStop(0.14, '#14161a');
        matteGrad.addColorStop(0.55, '#191b20');
        matteGrad.addColorStop(0.92, '#111317');
        matteGrad.addColorStop(0.97, '#2c3038');
        matteGrad.addColorStop(1.00, '#08090b');

        ctx.fillStyle = matteGrad;
        ctx.beginPath();
        ctx.roundRect(bodyX, bodyY, bodyW, bodyH, [2 * scale, 2 * scale, cornerR, cornerR]);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = Math.max(1, 1.2 * scale);
        ctx.beginPath();
        ctx.moveTo(bodyX + 2 * scale, bodyY + 1 * scale);
        ctx.lineTo(bodyX + bodyW - 2 * scale, bodyY + 1 * scale);
        ctx.stroke();

        if (this.isLit) {
          const warmReflection = ctx.createLinearGradient(bodyX, bodyY, bodyX, bodyY + bodyH * 0.45);
          warmReflection.addColorStop(0, 'rgba(251, 146, 60, 0.25)');
          warmReflection.addColorStop(1, 'rgba(251, 146, 60, 0)');
          ctx.fillStyle = warmReflection;
          ctx.beginPath();
          ctx.roundRect(bodyX, bodyY, bodyW, bodyH * 0.45, [2 * scale, 2 * scale, 0, 0]);
          ctx.fill();
        }

        ctx.strokeStyle = '#050607';
        ctx.lineWidth = Math.max(1, 1.5 * scale);
        ctx.beginPath();
        ctx.roundRect(bodyX, bodyY, bodyW, bodyH, [2 * scale, 2 * scale, cornerR, cornerR]);
        ctx.stroke();

        if (this.stickerImage && this.stickerImage.complete && this.stickerImage.naturalWidth > 0) {
          this.drawBodySticker(ctx, g);
        }

        ctx.restore();
      }

      loadSavedSticker() {
        try {
          const savedDataUrl = localStorage.getItem(this.stickerStorageKey);
          if (!savedDataUrl) {
            this.updateStickerUI(false);
            return;
          }
          const img = new Image();
          img.onload = () => {
            this.stickerImage = img;
            this.updateStickerUI(true);
            if (this.isVisible) this.render();
          };
          img.onerror = () => {
            this.stickerImage = null;
            this.updateStickerUI(false);
          };
          img.src = savedDataUrl;
        } catch (e) {
          this.updateStickerUI(false);
        }
      }

      processAndSaveSticker(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const rawImg = new Image();
          rawImg.onload = () => {
            try {
              const maxDim = 640;
              let w = rawImg.naturalWidth || rawImg.width;
              let h = rawImg.naturalHeight || rawImg.height;
              if (w <= 0 || h <= 0) return;

              if (w > maxDim || h > maxDim) {
                if (w >= h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }

              const offscreen = document.createElement('canvas');
              offscreen.width = w;
              offscreen.height = h;
              const octx = offscreen.getContext('2d');
              octx.clearRect(0, 0, w, h);
              octx.drawImage(rawImg, 0, 0, w, h);

              const isAlphaFormat = file.type === 'image/png' || file.type === 'image/webp' || file.type === 'image/svg+xml';
              const dataUrl = isAlphaFormat
                ? offscreen.toDataURL('image/png')
