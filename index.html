                : offscreen.toDataURL('image/jpeg', 0.88);

              try {
                localStorage.setItem(this.stickerStorageKey, dataUrl);
              } catch (storageErr) {}

              const finalImg = new Image();
              finalImg.onload = () => {
                this.stickerImage = finalImg;
                this.updateStickerUI(true);
                if (this.isVisible) this.render();
                showToast('Pegatina guardada');
              };
              finalImg.src = dataUrl;
            } catch (err) {
              showToast('Error de imagen');
            }
          };
          rawImg.onerror = () => showToast('Formato no válido');
          rawImg.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      clearSticker() {
        this.stickerImage = null;
        try {
          localStorage.removeItem(this.stickerStorageKey);
        } catch (e) {}
        const input = document.getElementById('zippo-sticker-input');
        if (input) input.value = '';
        this.updateStickerUI(false);
        if (this.isVisible) this.render();
        showToast('Pegatina eliminada');
      }

      updateStickerUI(hasSticker) {
        const clearBtn = document.getElementById('btn-zippo-sticker-clear');
        if (clearBtn) {
          if (hasSticker) {
            clearBtn.classList.remove('hidden');
            clearBtn.classList.add('flex');
          } else {
            clearBtn.classList.add('hidden');
            clearBtn.classList.remove('flex');
          }
        }
      }

      drawBodySticker(ctx, g) {
        const { bodyX, bodyY, bodyW, bodyH, scale } = g;
        const img = this.stickerImage;
        const imgW = img.naturalWidth || img.width;
        const imgH = img.naturalHeight || img.height;
        if (!imgW || !imgH) return;

        const marginX = bodyW * 0.11;
        const marginTop = bodyH * 0.08;
        const marginBottom = bodyH * 0.10;
        const availW = bodyW - marginX * 2;
        const availH = bodyH - marginTop - marginBottom;

        const fitScale = Math.min(availW / imgW, availH / imgH);
        const drawW = imgW * fitScale;
        const drawH = imgH * fitScale;
        const drawX = bodyX + (bodyW - drawW) * 0.5;
        const drawY = bodyY + marginTop + (availH - drawH) * 0.5;
        const stickerR = Math.max(3, 5 * scale);

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
        ctx.shadowBlur = 4 * scale;
        ctx.shadowOffsetY = 1.5 * scale;

        ctx.beginPath();
        ctx.roundRect(drawX, drawY, drawW, drawH, stickerR);
        ctx.clip();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.drawImage(img, drawX, drawY, drawW, drawH);

        const cylShade = ctx.createLinearGradient(bodyX, drawY, bodyX + bodyW, drawY);
        cylShade.addColorStop(0.00, 'rgba(0, 0, 0, 0.35)');
        cylShade.addColorStop(0.14, 'rgba(255, 255, 255, 0.08)');
        cylShade.addColorStop(0.50, 'rgba(255, 255, 255, 0.02)');
        cylShade.addColorStop(0.88, 'rgba(0, 0, 0, 0.14)');
        cylShade.addColorStop(1.00, 'rgba(0, 0, 0, 0.38)');
        ctx.fillStyle = cylShade;
        ctx.fillRect(drawX, drawY, drawW, drawH);

        if (this.isLit) {
          const flameTint = ctx.createLinearGradient(drawX, drawY, drawX, drawY + drawH);
          flameTint.addColorStop(0, 'rgba(255, 175, 75, 0.22)');
          flameTint.addColorStop(1, 'rgba(255, 140, 40, 0.03)');
          ctx.fillStyle = flameTint;
          ctx.fillRect(drawX, drawY, drawW, drawH);
        }

        ctx.restore();

        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = Math.max(0.75, 1 * scale);
        ctx.beginPath();
        ctx.roundRect(drawX, drawY, drawW, drawH, stickerR);
        ctx.stroke();
        ctx.restore();
      }

      drawMatteLid(ctx, g) {
        ctx.save();
        const { hingeX, hingeY, bodyW, lidH, cornerR, scale } = g;

        ctx.translate(hingeX, hingeY);
        ctx.rotate(this.lidAngle);

        const lidX = 0;
        const lidY = -lidH;

        const lidGrad = ctx.createLinearGradient(lidX, lidY, lidX + bodyW, lidY);
        lidGrad.addColorStop(0.00, '#090a0c');
        lidGrad.addColorStop(0.06, '#3d424b');
        lidGrad.addColorStop(0.14, '#14161a');
        lidGrad.addColorStop(0.55, '#1a1c22');
        lidGrad.addColorStop(0.92, '#111317');
        lidGrad.addColorStop(0.97, '#2f343d');
        lidGrad.addColorStop(1.00, '#08090b');

        ctx.fillStyle = lidGrad;
        ctx.beginPath();
        ctx.roundRect(lidX, lidY, bodyW, lidH, [cornerR, cornerR, 2 * scale, 2 * scale]);
        ctx.fill();

        const topHighlight = ctx.createRadialGradient(lidX + 12 * scale, lidY + 10 * scale, 1 * scale, lidX + 12 * scale, lidY + 10 * scale, 24 * scale);
        topHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
        topHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = topHighlight;
        ctx.beginPath();
        ctx.arc(lidX + 12 * scale, lidY + 10 * scale, 24 * scale, 0, Math.PI * 2);
        ctx.fill();

        if (this.isLit && this.isOpen) {
          const innerLidGlow = ctx.createLinearGradient(lidX + bodyW, lidY, lidX, lidY);
          innerLidGlow.addColorStop(0, 'rgba(255, 195, 110, 0.3)');
          innerLidGlow.addColorStop(0.35, 'rgba(255, 140, 40, 0.08)');
          innerLidGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = innerLidGlow;
          ctx.beginPath();
          ctx.roundRect(lidX, lidY, bodyW, lidH, [cornerR, cornerR, 2 * scale, 2 * scale]);
          ctx.fill();
        }

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = Math.max(0.8, 1 * scale);
        ctx.beginPath();
        ctx.moveTo(lidX + 2 * scale, -1 * scale);
        ctx.lineTo(lidX + bodyW - 2 * scale, -1 * scale);
        ctx.stroke();

        ctx.strokeStyle = '#050607';
        ctx.lineWidth = Math.max(1, 1.5 * scale);
        ctx.beginPath();
        ctx.roundRect(lidX, lidY, bodyW, lidH, [cornerR, cornerR, 2 * scale, 2 * scale]);
        ctx.stroke();

        ctx.restore();
      }

      drawHinge(ctx, g) {
        const { hingeX, hingeY, scale } = g;
        ctx.save();
        ctx.translate(hingeX - 3.5 * scale, hingeY);

        const barrels = 5;
        const barrelH = 3.2 * scale;
        const totalH = barrels * barrelH;
        const startY = -totalH / 2;

        for (let i = 0; i < barrels; i++) {
          const by = startY + i * barrelH;
          const bGrad = ctx.createLinearGradient(-4 * scale, by, 4 * scale, by);
          bGrad.addColorStop(0, '#334155');
          bGrad.addColorStop(0.45, '#f1f5f9');
          bGrad.addColorStop(0.85, '#64748b');
          bGrad.addColorStop(1, '#1e293b');

          ctx.fillStyle = bGrad;
          ctx.beginPath();
          ctx.roundRect(-4 * scale, by, 7.5 * scale, barrelH - 0.5 * scale, 1.5 * scale);
          ctx.fill();
        }
        ctx.restore();
      }

      drawNaturalFlame(ctx, g) {
        const insX = g.bodyX + g.bodyW * 0.18;
        const insW = g.bodyW * 0.64;
        const insH = g.bodyH * 0.34;
        const insY = g.bodyY - insH + 4 * g.scale;
        const chimX = insX + insW * 0.14;
        const chimW = insW * 0.68;

        const originX = chimX + chimW * 0.5;
        const originY = insY + insH * 0.28;

        const flicker = (Math.sin(this.flameTime * 11) * 2.5 + Math.cos(this.flameTime * 19) * 1.5) * g.scale;
        const maxAvailableTop = Math.max(60, originY - (g.topMargin || 16));
        const rawFlameH = (195 * g.scale) * this.stretch + flicker * 0.65;
        const flameH = Math.max(55, Math.min(rawFlameH, maxAvailableTop));

        const baseW = Math.max(5, chimW * 0.22);
        const maxW = Math.max(8, chimW * 0.30);
        const tipX = (this.tiltX * 65 * g.scale) + flicker;

        ctx.save();
        ctx.translate(originX, originY);
        ctx.globalCompositeOperation = 'screen';

        const haloRadius = Math.max(25, flameH * 0.72);
        const haloGrad = ctx.createRadialGradient(
          tipX * 0.4, -flameH * 0.52, Math.max(2, maxW * 0.2),
          tipX * 0.4, -flameH * 0.52, haloRadius
        );
        haloGrad.addColorStop(0.0, 'rgba(255, 165, 45, 0.52)');
        haloGrad.addColorStop(0.45, 'rgba(255, 106, 0, 0.22)');
        haloGrad.addColorStop(0.8, 'rgba(234, 88, 12, 0.06)');
        haloGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.ellipse(tipX * 0.4, -flameH * 0.52, Math.max(10, maxW * 2.1), Math.max(18, flameH * 0.66), this.tiltX * 0.28, 0, Math.PI * 2);
        ctx.fill();

        const outerFlameGrad = ctx.createLinearGradient(0, 0, tipX, -flameH);
        outerFlameGrad.addColorStop(0.00, 'rgba(26, 79, 255, 0.92)');
        outerFlameGrad.addColorStop(0.16, 'rgba(56, 152, 255, 0.85)');
        outerFlameGrad.addColorStop(0.28, 'rgba(255, 157, 46, 0.92)');
        outerFlameGrad.addColorStop(0.75, 'rgba(255, 106, 0, 0.78)');
        outerFlameGrad.addColorStop(1.00, 'rgba(255, 106, 0, 0)');

        ctx.fillStyle = outerFlameGrad;
        ctx.beginPath();
        ctx.moveTo(-baseW, 0);
        ctx.bezierCurveTo(
          -maxW * 1.24, -flameH * 0.28,
          -maxW * 1.02 + tipX * 0.52, -flameH * 0.68,
          tipX, -flameH
        );
        ctx.bezierCurveTo(
          maxW * 1.02 + tipX * 0.52, -flameH * 0.68,
          maxW * 1.24, -flameH * 0.28,
          baseW, 0
        );
        ctx.closePath();
        ctx.fill();

        const coreH = flameH * 0.92;
        const coreW = maxW * 0.84;
        const coreGrad = ctx.createLinearGradient(0, -2 * g.scale, tipX * 0.92, -coreH);
        coreGrad.addColorStop(0.00, 'rgba(15, 45, 180, 0.95)');
        coreGrad.addColorStop(0.14, 'rgba(40, 115, 245, 0.85)');
        coreGrad.addColorStop(0.23, 'rgba(255, 210, 130, 0.96)');
        coreGrad.addColorStop(0.34, 'rgba(255, 255, 255, 1.0)');
        coreGrad.addColorStop(0.88, 'rgba(255, 255, 255, 0.96)');
        coreGrad.addColorStop(1.00, 'rgba(255, 230, 170, 0)');

        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.moveTo(-baseW * 0.72, -2 * g.scale);
        ctx.bezierCurveTo(
          -coreW, -coreH * 0.28,
          -coreW * 0.85 + tipX * 0.50, -coreH * 0.68,
          tipX * 0.94, -coreH
        );
        ctx.bezierCurveTo(
          coreW * 0.85 + tipX * 0.50, -coreH * 0.68,
          coreW, -coreH * 0.28,
          baseW * 0.72, -2 * g.scale
        );
        ctx.closePath();
        ctx.fill();

        const bluePocketH = flameH * 0.24;
        const bluePocketGrad = ctx.createLinearGradient(0, 0, 0, -bluePocketH);
        bluePocketGrad.addColorStop(0.0, 'rgba(10, 28, 95, 0.95)');
        bluePocketGrad.addColorStop(0.55, 'rgba(26, 79, 255, 0.75)');
        bluePocketGrad.addColorStop(1.0, 'rgba(56, 152, 255, 0)');

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = bluePocketGrad;
        ctx.beginPath();
        ctx.moveTo(-baseW * 0.62, 0);
        ctx.quadraticCurveTo(-baseW * 0.55, -bluePocketH * 0.75, tipX * 0.14, -bluePocketH);
        ctx.quadraticCurveTo(baseW * 0.55, -bluePocketH * 0.75, baseW * 0.62, 0);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      drawParticles(ctx) {
        ctx.save();
        for (const s of this.sparks) {
          ctx.fillStyle = `rgba(255, ${Math.floor(180 + s.life * 75)}, 80, ${Math.max(0, s.life)})`;
          ctx.shadowColor = '#f59e0b';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(s.x, s.y, Math.max(0.5, s.size), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        ctx.save();
        for (const sm of this.smoke) {
          ctx.fillStyle = `rgba(203, 213, 225, ${Math.max(0, sm.alpha)})`;
          ctx.beginPath();
          ctx.arc(sm.x, sm.y, Math.max(1, sm.radius), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    /**
     * ============================================================================
     * 6. INICIALIZACIÓN GLOBAL DEFENSIVA Y CONMUTACIÓN SIN SOLAPAMIENTOS
     * ============================================================================
     */
    function initApp() {
      if (window.__strobeZippoInitialized) return;
      window.__strobeZippoInitialized = true;

      try {
        lockPortraitOrientation();

        const torchController = new SmartHardwareTorchController();
        const strobeEngine = new StrobeAndAudioEngine(torchController);
        const zippoAudio = new ProceduralZippoAudio();
        const zippoSim = new MatteZippoSimulator(torchController, zippoAudio);

        const tabTorch = document.getElementById('tab-torch');
        const tabZippo = document.getElementById('tab-zippo');
        const viewTorch = document.getElementById('view-torch');
        const viewZippo = document.getElementById('view-zippo');

        let activeTab = 'torch';
        let zippoManualLedOn = false;
        let zippoAnimId = null;
        let lastTimestamp = performance.now();

        const startZippoLoop = () => {
          if (zippoAnimId !== null) return;
          lastTimestamp = performance.now();
          const step = (now) => {
            if (activeTab !== 'zippo' || !zippoSim.isVisible) {
              zippoAnimId = null;
              return;
            }
            const dt = Math.min((now - lastTimestamp) / 1000, 0.05);
            lastTimestamp = now;
            try {
              zippoSim.updatePhysics(dt);
              zippoSim.render();
            } catch (err) {}
            zippoAnimId = requestAnimationFrame(step);
          };
          zippoAnimId = requestAnimationFrame(step);
        };

        const stopZippoLoop = () => {
          if (zippoAnimId !== null) {
            cancelAnimationFrame(zippoAnimId);
            zippoAnimId = null;
          }
          zippoSim.setVisible(false);
        };

        const updateZippoLedButtonUI = (isOn) => {
          zippoManualLedOn = isOn;
          const btn = document.getElementById('btn-zippo-manual-led');
          const dot = document.getElementById('zippo-led-dot');
          const txt = document.getElementById('zippo-led-text');

          if (btn) btn.classList.toggle('active-amber', isOn);
          if (dot) {
            dot.className = isOn
              ? 'w-2 h-2 rounded-full bg-white shrink-0'
              : 'w-2 h-2 rounded-full bg-zinc-500 shrink-0';
          }
          if (txt) txt.textContent = isOn ? 'Apagar LED' : 'Encender LED';
        };

        const toggleZippoManualLed = async () => {
          try {
            const nextState = !zippoManualLedOn;
            if (nextState) {
              await torchController.initHardware();
            }
            await torchController.setTorch(nextState);
            updateZippoLedButtonUI(nextState);
          } catch (e) {}
        };

        const switchTab = (tab) => {
          activeTab = tab;

          if (tab === 'torch') {
            if (zippoSim.isFullscreen || document.body.classList.contains('zippo-fullscreen-mode')) {
              zippoSim.toggleFullscreen(false);
            }
            stopZippoLoop();

            viewZippo.classList.remove('active');
            viewTorch.classList.add('active');

            tabTorch.className = 'flex-1 py-1.5 px-2.5 rounded-lg font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-1.5 transition-all bg-amber-500/20 text-amber-400 border border-amber-500/40';
            tabZippo.className = 'flex-1 py-1.5 px-2.5 rounded-lg font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-1.5 transition-all text-zinc-400 border border-transparent';

            if (zippoManualLedOn) {
              updateZippoLedButtonUI(false);
              torchController.setTorch(false);
            }
          } else {
            strobeEngine.stopAll();

            viewTorch.classList.remove('active');
            viewZippo.classList.add('active');

            tabZippo.className = 'flex-1 py-1.5 px-2.5 rounded-lg font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-1.5 transition-all bg-amber-500/20 text-amber-400 border border-amber-500/40';
            tabTorch.className = 'flex-1 py-1.5 px-2.5 rounded-lg font-bold text-xs tracking-wide uppercase flex items-center justify-center gap-1.5 transition-all text-zinc-400 border border-transparent';

            zippoSim.setVisible(true);
            startZippoLoop();
          }
        };

        if (tabTorch) tabTorch.addEventListener('click', () => switchTab('torch'));
        if (tabZippo) tabZippo.addEventListener('click', () => switchTab('zippo'));

        const btnTestLed = document.getElementById('btn-test-led');
        if (btnTestLed) {
          btnTestLed.addEventListener('click', () => torchController.runDiagnosticTest());
        }

        const btnStrobe = document.getElementById('btn-torch-strobe');
        if (btnStrobe) {
          btnStrobe.addEventListener('click', () => strobeEngine.toggleStrobe());
        }

        const btnSteady = document.getElementById('btn-torch-steady');
        if (btnSteady) {
          btnSteady.addEventListener('click', () => strobeEngine.toggleSteady());
        }

        const freqSlider = document.getElementById('strobe-freq-slider');
        if (freqSlider) {
          freqSlider.addEventListener('input', (e) => strobeEngine.setFrequency(e.target.value));
        }

        const btnTapTempo = document.getElementById('btn-tap-tempo');
        if (btnTapTempo) {
          btnTapTempo.addEventListener('click', () => strobeEngine.registerTapTempo());
        }

        const btnMicToggle = document.getElementById('btn-mic-toggle');
        if (btnMicToggle) {
          btnMicToggle.addEventListener('click', () => strobeEngine.toggleMicrophone());
        }

        const rhythmSelect = document.getElementById('rhythm-pattern-select');
        if (rhythmSelect) {
          rhythmSelect.addEventListener('change', (e) => {
            strobeEngine.rhythmPattern = e.target.value;
            if (strobeEngine.mode === 'mic') {
              strobeEngine.clearScheduledPulses();
              torchController.setTorch(strobeEngine.rhythmPattern === 'inverted');
            }
          });
        }

        const btnSensors = document.getElementById('btn-zippo-sensors');
        if (btnSensors) {
          btnSensors.addEventListener('click', (e) => {
            e.stopPropagation();
            zippoSim.toggleSensors();
          });
        }

        const btnFsEnter = document.getElementById('btn-zippo-fullscreen');
        if (btnFsEnter) {
          btnFsEnter.addEventListener('click', (e) => {
            e.stopPropagation();
            zippoSim.toggleFullscreen(true);
          });
        }

        const btnFsExit = document.getElementById('btn-exit-fullscreen');
        if (btnFsExit) {
          btnFsExit.addEventListener('click', (e) => {
            e.stopPropagation();
            zippoSim.toggleFullscreen(false);
          });
        }

        const handleNativeFullscreenChange = () => {
          const isNativeFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
          if (!isNativeFs && zippoSim.isFullscreen) {
            zippoSim.restoreNormalView(false);
          }
        };
        document.addEventListener('fullscreenchange', handleNativeFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleNativeFullscreenChange);

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && zippoSim.isFullscreen) {
            zippoSim.toggleFullscreen(false);
          }
        });

        const btnManualLed = document.getElementById('btn-zippo-manual-led');
        if (btnManualLed) {
          btnManualLed.addEventListener('click', () => toggleZippoManualLed());
        }

        const btnSticker = document.getElementById('btn-zippo-sticker');
        const inputSticker = document.getElementById('zippo-sticker-input');
        const btnStickerClear = document.getElementById('btn-zippo-sticker-clear');

        if (btnSticker && inputSticker) {
          btnSticker.addEventListener('click', () => inputSticker.click());
          inputSticker.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (file) zippoSim.processAndSaveSticker(file);
          });
        }

        if (btnStickerClear) {
          btnStickerClear.addEventListener('click', () => zippoSim.clearSticker());
        }
      } catch (fatalErr) {
        showToast('Error al iniciar');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
